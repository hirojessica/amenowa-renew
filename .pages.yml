media:
  input: site/public/uploads
  output: /uploads
  extensions: [jpg, jpeg, png, webp, avif, pdf]
  rename: safe
content:
  - name: news
    label: INSIGHTS（お知らせ・ブログ）
    type: collection
    path: site/content/news
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    view:
      primary: title
      fields: [title, date, category, published]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
      - name: slug
        label: 記事URL（半角英数字・ハイフン）
        type: string
        required: true
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        description: 公開後は変更しないでください。例 water-report-2026
      - name: date
        label: 公開日
        type: date
        required: true
      - name: time
        label: 公開時刻（任意）
        type: string
        pattern: '^(?:(?:[01]\d|2[0-3]):[0-5]\d)?$'
        description: 同じ公開日の記事を新しい順に並べるための時刻です。例 18:53。空欄は00:00として扱い、時刻での予約公開は行いません。
      - name: category
        label: カテゴリー
        type: select
        required: true
        description: noteから転載する記事も「ブログ」を選択してください。
        options:
          values: [お知らせ, ブログ, プレスリリース]
      - name: kind
        label: 掲載方法
        type: select
        default: article
        options:
          values:
            - name: article
              label: サイト内に本文を掲載
            - name: link
              label: noteなど外部の記事へリンク
        description: 未選択の場合はサイト内に本文を掲載します。
      - name: externalUrl
        label: 外部の記事URL
        type: string
        description: 外部の記事へリンクする場合は必須です。httpsから始まる記事URLを入力してください。本文は不要です。
      - name: sourceUrl
        label: 転載元の記事URL（任意）
        type: string
        description: noteの本文を手動で掲載する場合などに、元の記事へのリンクを表示できます。
      - name: published
        label: サイトに掲載する
        type: boolean
        description: オフの記事はサイトに表示されません。公開リポジトリ内の原稿自体は閲覧可能です。
      - name: excerpt
        label: 一覧用の説明文
        type: text
      - name: image
        label: 記事画像
        type: image
      - name: imageAlt
        label: 画像の説明
        type: string
      - name: body
        label: 本文
        type: rich-text
        description: サイト内に本文を掲載する場合は入力してください。noteの原稿を手動でコピーできます。
  - name: cases
    label: CASE STUDY（取り組み・事例）
    type: collection
    path: site/content/cases
    subfolders: false
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    view:
      primary: title
      fields: [title, order, client, published]
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: 事例名
        type: string
        required: true
      - name: slug
        label: 事例URL
        type: string
        required: true
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        description: 公開後は変更しないでください。
      - name: published
        label: サイトに掲載する
        type: boolean
      - name: client
        label: 英字ラベル
        type: string
      - name: order
        label: 表示順（小さい数字から）
        type: number
        default: 100
        options:
          min: 0
        description: 0以上の整数を入力してください。ルスツは10。下に追加する場合は20、30…と指定できます。同じ数字の場合はURL順になります。
      - name: headline
        label: メイン見出し
        type: string
        required: true
      - name: excerpt
        label: 紹介文
        type: text
      - name: image
        label: 活動写真
        type: image
        description: トップ・事例一覧・SERVICESの事例概要に表示します。詳細ページ冒頭の画像が未設定の場合は、そこにも表示します。
      - name: imageAlt
        label: 写真の説明
        type: string
      - name: heroImage
        label: 詳細ページ冒頭の画像（任意）
        type: image
        description: 詳細ページのメイン見出し横だけに表示します。未設定なら活動写真を使います。
      - name: heroImageAlt
        label: 詳細ページ冒頭の画像の説明
        type: string
        description: 詳細ページ冒頭の画像を設定した場合は、画像の内容を説明してください。
      - name: timeline
        label: 従来の取り組みの流れ・SERVICESへの関連付け
        type: object
        list: true
        description: 年表を使う場合、事例ページでは年表が優先されます。既存のSERVICES関連付けに使っている項目は残してください。
        fields:
          - name: title
            label: 見出し
            type: string
            required: true
          - name: description
            label: 取り組み内容
            type: text
            required: true
          - name: detail
            label: 詳細・実施時期
            type: text
            description: 確定していない場合は「未定」としてください。
          - name: services
            label: 関連するサービス（任意・複数選択）
            type: select
            options:
              multiple: true
              values:
                - name: strategy
                  label: サステナビリティ戦略・事業設計
                - name: field
                  label: 水・自然資本の調査・実装
                - name: community
                  label: 地域共創・環境教育
                - name: communication
                  label: サステナブル・ブランディング
            description: 選択したサービスの詳細ページにも、この取り組みが掲載されます。未選択の場合は事例ページだけに掲載します。
          - name: serviceDetail
            label: サービス詳細ページ用の紹介文
            type: text
            description: 背景・課題、具体的な取り組み、確定した成果などを記入できます。未確定の場合は「未定」。改行はそのまま表示します。
      - name: servicePhotos
        label: SERVICESのルスツ実績写真（任意）
        type: object
        list: true
        description: ルスツリゾート用の掲載枠です。写真を受領後に登録すると、SERVICES一覧とサービス詳細の両方に反映されます。年表写真とは別の設定です。
        fields:
          - name: slot
            label: 掲載場所（同じ場所は1件まで）
            type: select
            required: true
            options:
              values:
                - name: strategy
                  label: 01 戦略・連携
                - name: field
                  label: 02 森林・水路・井戸調査
                - name: symposium
                  label: 03 水循環シンポジウム
                - name: education
                  label: 03 子ども・フィールド教育
                - name: branding
                  label: 04 記録・発信
          - name: image
            label: 実績写真
            type: image
          - name: imageAlt
            label: 写真の説明（写真を登録した場合は必須）
            type: string
          - name: caption
            label: 写真のキャプション（任意）
            type: string
      - name: body
        label: 補足本文（任意）
        type: rich-text
      - name: projectIntro
        label: プロジェクトの導入文（任意）
        type: rich-text
        description: ヒーローの下、取り組み紹介の前に表示します。
      - name: storySections
        label: 取り組みの紹介（任意）
        type: object
        list: true
        fields:
          - name: label
            label: 分類ラベル
            type: string
            required: true
          - name: headline
            label: 見出し
            type: string
            required: true
          - name: body
            label: 紹介本文
            type: rich-text
            required: true
      - name: chronology
        label: 写真を追加できる年表（任意）
        type: object
        description: 年・時期・取り組みの順で編集します。年表そのものを画像にする必要はありません。
        fields:
          - name: title
            label: 年表の見出し
            type: string
            required: true
          - name: intro
            label: 年表の紹介文
            type: text
          - name: years
            label: 年
            type: object
            list: true
            required: true
            fields:
              - name: year
                label: 西暦
                type: number
                required: true
                options:
                  min: 1900
                  max: 9999
                description: 2024のように4桁の整数を入力。表示は年の昇順です。
              - name: phase
                label: この年のテーマ
                type: string
                required: true
              - name: description
                label: この年の説明
                type: text
              - name: periods
                label: 時期
                type: object
                list: true
                required: true
                fields:
                  - name: label
                    label: 時期の表示
                    type: string
                    required: true
                    description: 9月、前半〜夏など。時期はこのリストの順に表示します。
                  - name: events
                    label: この時期の取り組み
                    type: object
                    list: true
                    required: true
                    fields:
                      - name: title
                        label: 取り組み名
                        type: string
                        required: true
                      - name: category
                        label: 年表内の分類
                        type: select
                        required: true
                        options:
                          values:
                            - name: strategy
                              label: 01 サステナビリティ戦略・事業設計
                            - name: research
                              label: 02 水・自然資本の調査・実装
                            - name: community
                              label: 03 地域共創・環境教育
                            - name: branding
                              label: 04 サステナブル・ブランディング
                      - name: next
                        label: 次につながること
                        type: text
                        description: 矢印に続けて表示する説明です。
                      - name: related
                        label: 関連する分野（任意）
                        type: string
                      - name: image
                        label: 写真・画面画像（任意）
                        type: image
                        description: 画像のある取り組みだけ登録してください。空欄の場合は文字だけを表示します。後から追加でき、登録した画像はクリックで拡大できます。
                      - name: imageAlt
                        label: 画像の説明
                        type: string
                      - name: caption
                        label: 画像の下に表示する説明（任意）
                        type: text
          - name: outcomeTitle
            label: 年表の結びの見出し（任意）
            type: string
          - name: outcome
            label: 年表の結びの本文（任意）
            type: text
