media:
  input: site/public/uploads
  output: /uploads
  extensions: [jpg, jpeg, png, webp, avif, pdf]
  rename: safe
content:
  - name: news
    label: INSIGHTS（お知らせ・ブログ）
    type: collection
    path: site/content/news
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    view:
      primary: title
      fields: [title, date, category, published]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
      - name: slug
        label: 記事URL（半角英数字・ハイフン）
        type: string
        required: true
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        description: 公開後は変更しないでください。例 water-report-2026
      - name: date
        label: 公開日
        type: date
        required: true
      - name: time
        label: 公開時刻（任意）
        type: string
        pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
        description: 同じ公開日の記事を新しい順に並べるための時刻です。例 18:53。空欄は00:00として扱い、時刻での予約公開は行いません。
      - name: category
        label: カテゴリー
        type: select
        required: true
        description: noteから転載する記事も「ブログ」を選択してください。
        options:
          values: [お知らせ, ブログ, プレスリリース]
      - name: kind
        label: 掲載方法
        type: select
        default: article
        options:
          values:
            - name: article
              label: サイト内に本文を掲載
            - name: link
              label: noteなど外部の記事へリンク
        description: 未選択の場合はサイト内に本文を掲載します。
      - name: externalUrl
        label: 外部の記事URL
        type: string
        description: 外部の記事へリンクする場合は必須です。httpsから始まる記事URLを入力してください。本文は不要です。
      - name: sourceUrl
        label: 転載元の記事URL（任意）
        type: string
        description: noteの本文を手動で掲載する場合などに、元の記事へのリンクを表示できます。
      - name: published
        label: サイトに掲載する
        type: boolean
        description: オフの記事はサイトに表示されません。公開リポジトリ内の原稿自体は閲覧可能です。
      - name: excerpt
        label: 一覧用の説明文
        type: text
      - name: image
        label: 記事画像
        type: image
      - name: imageAlt
        label: 画像の説明
        type: string
      - name: body
        label: 本文
        type: rich-text
        description: サイト内に本文を掲載する場合は入力してください。noteの原稿を手動でコピーできます。
  - name: cases
    label: CASE STUDY（取り組み・事例）
    type: collection
    path: site/content/cases
    subfolders: false
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    view:
      primary: title
      fields: [title, order, client, published]
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: 事例名
        type: string
        required: true
      - name: slug
        label: 事例URL
        type: string
        required: true
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        description: 公開後は変更しないでください。
      - name: published
        label: サイトに掲載する
        type: boolean
      - name: client
        label: 英字ラベル
        type: string
      - name: order
        label: 表示順（小さい数字から）
        type: number
        default: 100
        options:
          min: 0
        description: 0以上の整数を入力してください。ルスツは10。下に追加する場合は20、30…と指定できます。同じ数字の場合はURL順になります。
      - name: headline
        label: メイン見出し
        type: string
        required: true
      - name: excerpt
        label: 紹介文
        type: text
      - name: image
        label: 活動写真
        type: image
      - name: imageAlt
        label: 写真の説明
        type: string
      - name: timeline
        label: 取り組みの流れ
        type: object
        list: true
        required: true
        fields:
          - name: title
            label: 見出し
            type: string
            required: true
          - name: description
            label: 取り組み内容
            type: text
            required: true
          - name: detail
            label: 詳細・実施時期
            type: text
            description: 確定していない場合は「未定」としてください。
          - name: services
            label: 関連するサービス（任意・複数選択）
            type: select
            options:
              multiple: true
              values:
                - name: strategy
                  label: STRATEGY / 一緒に考える
                - name: field
                  label: FIELD / 現場で動かす
                - name: communication
                  label: COMMUNICATION / 社会に伝える
            description: 選択したサービスの詳細ページにも、この取り組みが掲載されます。未選択の場合は事例ページだけに掲載します。
          - name: serviceDetail
            label: サービス詳細ページ用の紹介文
            type: text
            description: 背景・課題、具体的な取り組み、確定した成果などを記入できます。未確定の場合は「未定」。改行はそのまま表示します。
      - name: body
        label: 補足本文（任意）
        type: rich-text
