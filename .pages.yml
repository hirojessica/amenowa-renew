media:
  input: site/public/uploads
  output: /uploads
  extensions: [jpg, jpeg, png, webp, avif, pdf]
  rename: safe
content:
  - name: news
    label: お知らせ・ブログ
    type: collection
    path: site/content/news
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    view:
      primary: title
      fields: [title, date, category, published]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
      - name: slug
        label: 記事URL（半角英数字・ハイフン）
        type: string
        required: true
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        description: 公開後は変更しないでください。例 water-report-2026
      - name: date
        label: 公開日
        type: date
        required: true
      - name: time
        label: 公開時刻（任意）
        type: string
        pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
        description: 同じ公開日の記事を新しい順に並べるための時刻です。例 18:53。空欄は00:00として扱い、時刻での予約公開は行いません。
      - name: category
        label: カテゴリー
        type: select
        required: true
        options:
          values: [お知らせ, ブログ, プレスリリース]
      - name: published
        label: サイトに掲載する
        type: boolean
        description: オフの記事はサイトに表示されません。公開リポジトリ内の原稿自体は閲覧可能です。
      - name: excerpt
        label: 一覧用の説明文
        type: text
      - name: image
        label: 記事画像
        type: image
      - name: imageAlt
        label: 画像の説明
        type: string
      - name: body
        label: 本文
        type: rich-text
        required: true
