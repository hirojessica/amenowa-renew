<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>amenowa OGP artwork</title>
  <link rel="icon" href="../assets/favicon-32x32.png">
  <style>
    @font-face{font-family:OgpSerif;src:url('../node_modules/@fontsource/noto-serif-jp/files/noto-serif-jp-japanese-400-normal.woff2') format('woff2');font-weight:400}
    @font-face{font-family:OgpSans;src:url('../node_modules/@fontsource/noto-sans-jp/files/noto-sans-jp-japanese-400-normal.woff2') format('woff2');font-weight:400}
    *{box-sizing:border-box}body{margin:0;background:#fdfdfc;color:#203d3e}
    .share-art{position:relative;width:1200px;height:630px;overflow:hidden;padding:76px 84px;font-family:OgpSans,sans-serif}
    .brand{display:flex;align-items:center;gap:24px;height:56px}
    .symbol{width:104px;height:auto}.wordmark{width:264px;height:auto}
    h1{font:400 54px/1.65 OgpSerif,serif;letter-spacing:.02em;margin:83px 0 0;position:relative;z-index:1}
    h1 span{display:block;white-space:nowrap}
    p{font-size:21px;letter-spacing:.025em;margin:40px 0 0;position:relative;z-index:1}
    .wave{position:absolute;inset:0;width:1200px;height:630px;pointer-events:none}
  </style>
</head>
<body>
  <main class="share-art">
    <svg class="wave" viewBox="0 0 1200 630" aria-hidden="true"><path fill="#0081a6" d="M1044 0 C996 101 1128 176 1044 271 C1008 318 996 365 996 441 C996 517 1008 567 1056 630 H1200 V0Z"/></svg>
    <div class="brand"><img class="symbol" src="../assets/amenowa-symbol-official.png" alt=""><img class="wordmark" src="../assets/amenowa-wordmark-official.png" alt="amenowa"></div>
    <h1><span>水を測る。水を知る。</span><span>水の未来を、ともにつくる。</span></h1>
    <p>観測とデータから、持続可能な水利用と水の再生へ。</p>
  </main>
</body>
</html>
